[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worktracker-agent"
version = "0.1.0"
description = "Standalone FastMCP server wired to the owned worktracker backend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.12.5",
    "fastmcp==2.14.5",
    "httpx>=0.27",
    "worktracker-sdk",
]

[tool.uv.sources]
worktracker-sdk = { path = "../worktracker-sdk", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.setuptools]
packages = [
    "worktracker_agent",
    "worktracker_agent.api",
    "worktracker_agent.mcp",
]

[tool.setuptools.package-dir]
worktracker_agent = "."
