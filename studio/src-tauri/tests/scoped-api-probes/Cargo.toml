[package]
name = "ticketry-scoped-api-probes"
version = "0.0.0"
edition = "2021"
publish = false

# Ordinary external dependency graphs are constructed by the compiler probes.
# Never enable a shipping workspace dev-dependency's test-support feature here.
[workspace]

[[test]]
name = "public_api_external_compile"
path = "../public_api_external_compile.rs"

[dev-dependencies]
serde_json = "=1.0.151"
tempfile = "=3.23.0"
