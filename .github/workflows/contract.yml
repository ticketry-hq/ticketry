name: WorkTracker contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python packages
        run: |
          uv sync --project backend --extra dev
          uv sync --project surfaces/worktracker-sdk --extra dev

      - name: Install JavaScript packages
        run: npm ci

      - name: Check generated contract drift
        env:
          WORKTRACKER_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: npm run contract:check

      - name: Backend tests
        working-directory: backend
        env:
          MUXED_DATA_DIR: ${{ runner.temp }}/ticketry-contract-data
          MUXED_STATE_DB: ${{ runner.temp }}/ticketry-contract-state.db
        run: uv run --extra dev pytest -q

      - name: MCP agent tests
        working-directory: surfaces/worktracker-agent
        run: uv run --group dev pytest -q

      - name: Python SDK tests
        working-directory: surfaces/worktracker-sdk
        run: uv run --extra dev pytest -q

      - name: TypeScript SDK validation
        run: |
          npm run test --workspace @worktracker/typescript-sdk
          npm run typecheck --workspace @worktracker/typescript-sdk
          npm run build --workspace @worktracker/typescript-sdk

      - name: Studio validation
        run: |
          npm run test --workspace @worktracker/studio
          npm run typecheck --workspace @worktracker/studio
          npm run build --workspace @worktracker/studio
