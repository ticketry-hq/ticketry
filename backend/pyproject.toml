[project]
name = "studio-server"
version = "0.2.0"
description = "Django ASGI backend for muxed."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.16,<6.1",
    "djangorestframework>=3.16,<3.18",
    "drf-spectacular>=0.28",
    "channels>=4",
    "uvicorn[standard]>=0.29.0",
    "ptyprocess>=0.7.0",
    "libtmux==0.37.0",
    "watchfiles>=0.21.0",
    "httpx>=0.27",
    "pydantic>=2.0.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "mcp>=1.29,<2",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23",
    "pytest-django",
    "daphne>=4",
    "worktracker-sdk",
    "ruff>=0.15.20",
]
packaging = [
    "pyinstaller>=6.0",
    "worktracker-agent",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "studio_server*",
    "apps*",
    "worktracker*",
]

[tool.setuptools.package-data]

[tool.uv.sources]
worktracker-sdk = { path = "../surfaces/worktracker-sdk", editable = true }
worktracker-agent = { path = "../surfaces/worktracker-agent", editable = true }

[tool.uv]
constraint-dependencies = [
    "cryptography>=50.0.0",
    "sqlparse>=0.6.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "studio_server.test_settings"
asyncio_mode = "auto"
python_files = ["test_*.py"]
