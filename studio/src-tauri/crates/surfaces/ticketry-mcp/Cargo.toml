[package]
name = "ticketry-mcp"
version = "0.0.0"
edition = "2021"
publish = false

[features]
# Fixture MCP authorizer and HTTP helpers the root package's `mcp_acceptance`
# integration binary needs; never enabled in a shipped build.
test-support = ["dep:reqwest", "ticketry-runs/test-support"]

[dependencies]
axum.workspace = true
chrono.workspace = true
http.workspace = true
reqwest = { workspace = true, optional = true }
rmcp.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
ticketry-agent-execution.workspace = true
ticketry-diagnostics.workspace = true
ticketry-entities.workspace = true
ticketry-launch.workspace = true
ticketry-runs.workspace = true
ticketry-settings.workspace = true
ticketry-terminal.workspace = true
ticketry-work-management.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
ticketry-runs = { workspace = true, features = ["test-support"] }
