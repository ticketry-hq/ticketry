[package]
name = "ticketry"
autobins = false
default-run = "ticketry"
version = "0.2.0"
description = "Least-privilege desktop shell for Ticketry"
license = "MIT"
edition = "2021"

[lib]
name = "muxed_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "=2.6.3", features = [] }

[features]
default = []
# The developer command line lives in `crates/ticketry-dev-tools` now, so this
# feature gates nothing. It stays declared, and empty, so the generation and
# verification scripts that still pass `--features development-tools` to this
# package keep working instead of failing on an unknown feature.
development-tools = []
# Both are the desktop shell's features; the root package forwards them so
# `studio/e2e` and the libghostty build keep the same command line, and so
# `build.rs` (which owns tauri.conf.json and the `cc` glue) still sees
# CARGO_FEATURE_NATIVE_LIBGHOSTTY.
desktop-acceptance = ["ticketry-desktop/desktop-acceptance"]
native-libghostty = ["ticketry-desktop/native-libghostty"]

[[bin]]
name = "ticketry"
path = "src/main.rs"

[dependencies]
# The root package is the shell's entry point and nothing else: `src/lib.rs`
# builds the Tauri context and hands it to the desktop crate, and `src/main.rs`
# activates a temporary SQLite profile before it. Every other slice reaches the
# binary through `ticketry-desktop`.
# `tauri::generate_context!` expands to `serde_json` paths, so the macro's
# crate needs it even though no line of this package names it.
serde_json.workspace = true
tauri.workspace = true
ticketry-desktop.workspace = true
ticketry-diagnostics.workspace = true
ticketry-terminal.workspace = true

[dev-dependencies]
# `tests/` holds the cross-slice contract binaries — the ones that assert over
# the assembled schema and across slice boundaries, above any single crate.
# They are the only reason the root package depends on the slices at all.
async-graphql.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures-util.workspace = true
http.workspace = true
log = "=0.4.33"
reqwest.workspace = true
sea-orm.workspace = true
seaography.workspace = true
seaolim.workspace = true
sha2.workspace = true
syn = { version = "=2.0.119", features = ["full", "visit"] }
tauri-graphql.workspace = true
tempfile.workspace = true
ticketry-agent-execution.workspace = true
ticketry-data-directory.workspace = true
ticketry-documents.workspace = true
ticketry-entities.workspace = true
ticketry-graphql-schema.workspace = true
ticketry-installation.workspace = true
ticketry-launch.workspace = true
ticketry-mcp = { workspace = true, features = ["test-support"] }
ticketry-runs = { workspace = true, features = ["test-support"] }
ticketry-settings.workspace = true
ticketry-tool-discovery.workspace = true
ticketry-work-management = { workspace = true, features = ["test-support"] }
ticketry-workspace-runtime.workspace = true
tokio.workspace = true
uuid.workspace = true

[workspace]
members = [
    ".",
    "crates/tauri-graphql",
    "crates/ticketry-data-directory",
    "crates/ticketry-entities",
    "crates/ticketry-runs",
    "crates/ticketry-settings",
    "crates/ticketry-work-management",
    "crates/ticketry-tool-discovery",
    "crates/ticketry-diagnostics",
    "crates/ticketry-documents",
    "crates/ticketry-workspace-runtime",
    "crates/ticketry-launch",
    "crates/ticketry-terminal",
    "crates/ticketry-agent-execution",
    "crates/ticketry-installation",
    "crates/ticketry-mcp",
    "crates/ticketry-graphql-schema",
    "crates/ticketry-desktop",
    "crates/ticketry-dev-tools",
]
resolver = "2"

[workspace.dependencies]
async-graphql = { version = "=7.0.19", features = ["dynamic-schema"] }
async-trait = "=0.1.92"
axum = { version = "=0.8.9", features = ["ws"] }
base64 = "0.22"
blake2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "=0.3.32"
http = "=1.4.2"
libc = "0.2"
notify = "=8.2.0"
portable-pty = "0.9"
rand = "0.8"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.0.0", features = ["transport-streamable-http-server"] }
sea-orm = { version = "=2.0.1", features = ["runtime-tokio-rustls", "seaography", "sqlx-postgres", "sqlx-sqlite"] }
sea-orm-migration = { version = "=2.0.1", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
seaography = { version = "=2.0.0-rc.9", default-features = false, features = ["field-camel-case", "macros", "with-chrono", "with-json"] }
seaolim = { git = "https://github.com/charleeagni/seaolim", rev = "29f24172be1ab423e9b8b14b11ba1fa73452f1cd" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri = "=2.11.5"
tauri-graphql = { path = "crates/tauri-graphql" }
taurpc = "=0.8.2"
tempfile = "=3.23.0"
ticketry-agent-execution = { path = "crates/ticketry-agent-execution" }
ticketry-data-directory = { path = "crates/ticketry-data-directory" }
ticketry-desktop = { path = "crates/ticketry-desktop" }
ticketry-dev-tools = { path = "crates/ticketry-dev-tools" }
ticketry-diagnostics = { path = "crates/ticketry-diagnostics" }
ticketry-documents = { path = "crates/ticketry-documents" }
ticketry-entities = { path = "crates/ticketry-entities" }
ticketry-graphql-schema = { path = "crates/ticketry-graphql-schema" }
ticketry-installation = { path = "crates/ticketry-installation" }
ticketry-launch = { path = "crates/ticketry-launch" }
ticketry-mcp = { path = "crates/ticketry-mcp" }
ticketry-runs = { path = "crates/ticketry-runs" }
ticketry-settings = { path = "crates/ticketry-settings" }
ticketry-terminal = { path = "crates/ticketry-terminal" }
ticketry-tool-discovery = { path = "crates/ticketry-tool-discovery" }
ticketry-work-management = { path = "crates/ticketry-work-management" }
ticketry-workspace-runtime = { path = "crates/ticketry-workspace-runtime" }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "=0.7.18"
uuid = { version = "1.24", features = ["v4", "v5"] }

# Development builds keep only the line tables. Full DWARF for a workspace this
# size costs tens of gigabytes and dominates link time; line tables still name
# the file and line in every panic and backtrace, which is what the test suite
# and the desktop crash reports actually read.
[profile.dev]
debug = "line-tables-only"
# Crate granularity is what makes a rebuild small now, so the incremental
# cache buys little and costs tens of gigabytes of `target/`.
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
# Unwinding must stay enabled: wry answers WKURLSchemeTask requests inside
# `objc2::exception::catch`, which cannot catch the "task has already been
# stopped" NSException under `panic = "abort"`. Aborting there turns a stale
# asset request into a process crash (CODING-1368 investigation).
panic = "unwind"
