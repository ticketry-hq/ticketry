fragment GeneratedWorkTrackerWorkItemFields on WorktrackerIssue {
  id
  name
  project_id: projectId
  sequence_id: sequenceId
  state_id: stateId
  state_revision: stateRevision
  description
  parent_id: parentId
  module_id: moduleId
  is_archived: isArchived
  created_at: createdAt
  updated_at: updatedAt
  rank
  issue_type_id: issueTypeId
  project { slug }
  children(filters: { isArchived: { eq: false } }) { nodes { id } }
  blocked_by_edges: blockedByEdges { nodes { to_issue_id: toIssueId } }
  blocks_edges: blocksEdges { nodes { from_issue_id: fromIssueId } }
}

query WorkTrackerWorkItems($projectId: String!) {
  work_items: worktrackerIssue(
    filters: { projectId: { eq: $projectId }, type: { eq: "task" } }
  ) {
    nodes { ...GeneratedWorkTrackerWorkItemFields }
  }
}

query WorkTrackerModuleTree($projectId: String!, $moduleId: String!) {
  work_items: worktrackerIssue(
    filters: { moduleId: { eq: $moduleId }, type: { eq: "task" } }
  ) {
    nodes { ...GeneratedWorkTrackerWorkItemFields }
  }
  states: worktrackerState(filters: { projectId: { eq: $projectId } }) {
    nodes {
      id
      name
      group
      color
      sort_order: sortOrder
      is_protected: isProtected
    }
  }
}

query WorkTrackerWorkItemsByIds($ids: [String!]!) {
  work_items_by_ids: worktrackerIssue(
    filters: { id: { is_in: $ids }, type: { eq: "task" } }
  ) {
    nodes { ...GeneratedWorkTrackerWorkItemFields }
  }
}

query WorkTrackerWorkItem($id: String!) {
  work_item: worktrackerIssue(filters: { id: { eq: $id }, type: { eq: "task" } }) {
    nodes { ...GeneratedWorkTrackerWorkItemFields }
  }
}

query WorkTrackerWorkItemByKey($projectSlug: String!, $sequenceId: Int!) {
  work_item: worktrackerIssue(
    filters: { sequenceId: { eq: $sequenceId }, type: { eq: "task" } }
    having: { project: { slug: { eq: $projectSlug } } }
  ) {
    nodes { ...GeneratedWorkTrackerWorkItemFields }
  }
}

mutation CreateWorkTrackerWorkItem($projectId: String!, $name: String!, $issueTypeId: String!, $description: String, $stateId: String, $parentId: String) {
  create_work_item(project_id: $projectId, name: $name, issue_type_id: $issueTypeId, description: $description, state_id: $stateId, parent_id: $parentId) {
    ...GeneratedWorkTrackerWorkItemFields
  }
}

mutation UpdateWorkTrackerWorkItem($id: String!, $name: String, $description: String, $issueTypeId: String) {
  update_work_item(id: $id, name: $name, description: $description, issue_type_id: $issueTypeId) {
    ...GeneratedWorkTrackerWorkItemFields
  }
}

mutation TransitionWorkTrackerWorkItem($id: String!, $targetStateId: String!) {
  update_work_item(id: $id, state_id: $targetStateId) {
    ...GeneratedWorkTrackerWorkItemFields
  }
}

mutation ReparentWorkTrackerWorkItem($id: String!, $parentId: String) {
  update_work_item(id: $id, parent_id: $parentId) {
    ...GeneratedWorkTrackerWorkItemFields
  }
}

mutation SetWorkTrackerBlockers($id: String!, $blockedByIds: [String!]!) {
  update_work_item(id: $id, blocked_by_ids: $blockedByIds) {
    ...GeneratedWorkTrackerWorkItemFields
  }
}

mutation ReorderWorkTrackerWorkItem($id: String!, $beforeId: String, $afterId: String, $initialOrderIds: [String!]) {
  reorder_work_item(id: $id, before_id: $beforeId, after_id: $afterId, initial_order_ids: $initialOrderIds) {
    ...GeneratedWorkTrackerWorkItemFields
  }
}

mutation DeleteWorkTrackerWorkItem($id: String!) {
  delete_work_item(id: $id)
}

mutation RunWorkTrackerWorkItemNow($idOrKey: String!, $requestIdentity: String!) {
  run_now(id_or_key: $idOrKey, request_identity: $requestIdentity) {
    target_id
    code
    detail
    remedy
    committed_state { id name }
    run { target_id agent agent_run_id }
  }
}
