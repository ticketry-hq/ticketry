	reparent_work_item(id: String!, parent_id: String, before_id: String, after_id: String): WorkItem!
	delete_work_item(id: String!): Boolean!
	create_attachment(issue_id: String!, filename: String!, mime_type: String, content_base64: String!): Attachment!
