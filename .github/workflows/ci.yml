name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    name: Rust desktop
    # macOS runners are expensive: run only on push to main or on pull
    # requests whose head branch lives in this repository (not forks).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # libghostty needs the macOS 26 SDK (e.g. kCVPixelFormatType_30RGB_r210).
    runs-on: macos-26
    env:
      # Zig 0.15.2 cannot link its build runner against the default Xcode
      # 26.6 SDK; 26.1.1 matches the development toolchain that builds it.
      DEVELOPER_DIR: /Applications/Xcode_26.1.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript packages
        run: npm ci

      # Rust terminal tests need tmux before desktop acceptance runs.
      - name: Install terminal prerequisite
        run: |
          command -v tmux || brew install tmux
          tmux -V

      # Studio acceptance tests compile native code against the prepared
      # libghostty headers, so preparation must come first.
      - name: Prepare native terminal renderer
        run: npm run libghostty:prepare --workspace @worktracker/studio

      - name: Studio typecheck, tests, and build
        run: |
          npm run typecheck
          npm run test:overhaul --workspace @worktracker/studio
          npm run test --workspace @worktracker/studio
          npm run build

      # tauri-build requires the externalBin sidecar to exist; stage it the
      # same way desktop:dev does.
      - name: Stage ticketry-hook sidecar
        run: >-
          node --input-type=module -e 'import { prepareDesktopHookRunner } from
          "./studio/scripts/desktop-hook-runner.mjs";
          prepareDesktopHookRunner({ root: process.cwd() });'

      - name: Desktop Rust tests
        run: cargo test --manifest-path studio/src-tauri/Cargo.toml --features native-libghostty --no-fail-fast

      - name: Frontend-to-agent desktop acceptance
        timeout-minutes: 30
        run: npm run test:e2e:desktop --workspace @worktracker/studio

      - name: Release contract tests
        run: |
          npm run release:test --workspace @worktracker/studio
          npm run release:validate --workspace @worktracker/studio
