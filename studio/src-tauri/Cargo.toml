[package]
name = "ticketry"
autobins = false
default-run = "ticketry"
version = "0.2.0"
description = "Least-privilege desktop shell for Ticketry"
license = "MIT"
edition = "2021"

[lib]
name = "muxed_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "=2.6.3", features = [] }

[features]
default = []
development-tools = []
desktop-acceptance = ["dep:tauri-plugin-wdio-webdriver"]
native-libghostty = []

[[bin]]
name = "ticketry"
path = "src/main.rs"

[[bin]]
name = "export_foundation_bindings"
path = "src/bin/export_foundation_bindings.rs"
required-features = ["development-tools"]

[[bin]]
name = "export_foundation_schema"
path = "src/bin/export_foundation_schema.rs"
required-features = ["development-tools"]

[[bin]]
name = "prepare_execution_generation_db"
path = "src/bin/prepare_execution_generation_db.rs"
required-features = ["development-tools"]

[[bin]]
name = "prepare_foundation_generation_db"
path = "src/bin/prepare_foundation_generation_db.rs"
required-features = ["development-tools"]

[[bin]]
name = "prepare_terminal_generation_db"
path = "src/bin/prepare_terminal_generation_db.rs"
required-features = ["development-tools"]

[[bin]]
name = "ticketry_graphql_adapter"
path = "src/bin/ticketry_graphql_adapter.rs"
required-features = ["development-tools"]

[[bin]]
name = "verify_slice4_copy"
path = "src/bin/verify_slice4_copy.rs"
required-features = ["development-tools"]

[[bin]]
name = "verify_slice5_copy"
path = "src/bin/verify_slice5_copy.rs"
required-features = ["development-tools"]

[[bin]]
name = "verify_slice6_copy"
path = "src/bin/verify_slice6_copy.rs"
required-features = ["development-tools"]

[dependencies]
async-graphql.workspace = true
async-trait = "=0.1.92"
axum = { version = "=0.8.9", features = ["ws"] }
base64 = "0.22"
blake2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util.workspace = true
http = "=1.4.2"
libc = "0.2"
notify = "=8.2.0"
portable-pty = "0.9"
process-wrap = { version = "9.1", default-features = false, features = [
    "std",
    "process-group",
] }
rand = "0.8"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.0.0", features = ["transport-streamable-http-server"] }
sea-orm = { version = "=2.0.1", features = ["runtime-tokio-rustls", "seaography", "sqlx-postgres", "sqlx-sqlite"] }
sea-orm-migration = { version = "=2.0.1", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
seaography = { version = "=2.0.0-rc.9", default-features = false, features = ["field-camel-case", "macros", "with-chrono", "with-json"] }
seaolim = { git = "https://github.com/charleeagni/seaolim", rev = "29f24172be1ab423e9b8b14b11ba1fa73452f1cd" }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tauri.workspace = true
tauri-graphql = { path = "crates/tauri-graphql" }
tauri-plugin-dialog = "2.6"
tauri-plugin-updater = "2"
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }
taurpc.workspace = true
tokio.workspace = true
tokio-util = "=0.7.18"
uuid = { version = "1.24", features = ["v4", "v5"] }

[dev-dependencies]
log = "=0.4.33"
syn = { version = "=2.0.119", features = ["full", "visit"] }
tempfile = "=3.23.0"

[workspace]
members = [".", "crates/tauri-graphql"]
resolver = "2"

[profile.release]
# Unwinding must stay enabled: wry answers WKURLSchemeTask requests inside
# `objc2::exception::catch`, which cannot catch the "task has already been
# stopped" NSException under `panic = "abort"`. Aborting there turns a stale
# asset request into a process crash (CODING-1368 investigation).
panic = "unwind"

[workspace.dependencies]
async-graphql = { version = "=7.0.19", features = ["dynamic-schema"] }
futures-util = "=0.3.32"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri = "=2.11.5"
taurpc = "=0.8.2"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
