[package]
name = "ticketry-desktop"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = []
# The wdio webdriver plugin the Playwright acceptance build drives. Forwarded
# from the root package so `studio/e2e` keeps building the same shell.
desktop-acceptance = ["dep:tauri-plugin-wdio-webdriver"]
# The macOS libghostty viewer. The `cc` glue and link directives stay in the
# root package's `build.rs`, which owns `tauri.conf.json`; this feature only
# gates the Rust side.
native-libghostty = []

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
http.workspace = true
notify.workspace = true
rand.workspace = true
reqwest.workspace = true
rustls-pki-types.workspace = true
sea-orm.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-graphql.workspace = true
tauri-plugin-dialog = "2.6"
tauri-plugin-updater = "2"
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }
taurpc.workspace = true
ticketry-agent-execution.workspace = true
ticketry-data-directory.workspace = true
ticketry-diagnostics.workspace = true
ticketry-documents.workspace = true
ticketry-entities.workspace = true
ticketry-graphql-schema.workspace = true
ticketry-launch.workspace = true
ticketry-mcp.workspace = true
ticketry-runs.workspace = true
ticketry-settings.workspace = true
ticketry-terminal.workspace = true
ticketry-tool-discovery.workspace = true
ticketry-work-management.workspace = true
ticketry-workspace-runtime.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
