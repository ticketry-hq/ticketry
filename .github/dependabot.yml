version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      javascript:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /surfaces/worktracker-agent
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /surfaces/worktracker-sdk
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /studio/src-tauri
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
