# The live-run holding shape, shared by the durable stream's snapshot frame and
# by the bootstrap preload query. One definition keeps the two paths incapable
# of disagreeing about what a live run carries.
fragment RunHoldingFields on AgentRunHolding {
  agent_run_id
  project_id
  task_id
  module_id
  agent
  scope
  launch_state
  launch_model
  started_at
  state
  effective_state
  updated_at
  provider_session_id
  output_sequence
  last_output_at
}

fragment AttemptProjectionFields on AutomationAttemptProjection {
  attempt_id
  root_attempt_id
  retry_of_attempt_id
  work_item_id
  status
  error
  failure
  retryable
  agent_run_id
  delivery_mode
  updated_at
}

# The snapshot as a plain query, issued during bootstrap so the badges have
# their data before the shell's first render rather than a second later, when
# the subscription's own snapshot finally lands behind the render.
query LiveRunStatusPreload($projectId: String!) {
  agent_run_holdings(project_id: $projectId) {
    ...RunHoldingFields
  }
  automation_attempts(project_id: $projectId) {
    ...AttemptProjectionFields
  }
}

subscription RunStatusStream($projectId: String!, $afterCursor: Int) {
  run_status_stream(project_id: $projectId, after_cursor: $afterCursor) {
    __typename
    ... on RunStatusSnapshot {
      project_id
      cursor
      at
      runs {
        ...RunHoldingFields
      }
      automation_attempts {
        ...AttemptProjectionFields
      }
    }
    ... on RunStatusEvent {
      cursor
      event_id
      project_id
      event_kind
      payload_version
      subject_kind
      subject_id
      agent_run_id
      automation_attempt_id
      work_item_id
      payload
      committed_at
    }
    ... on RunStatusCaughtUp {
      project_id
      cursor
    }
    ... on RunStatusResetRequired {
      project_id
      cursor
      reason
    }
    ... on RunStatusFailed {
      code
      message
    }
  }
}
