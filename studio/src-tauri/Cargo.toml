[package]
name = "ticketry"
version = "0.2.0"
description = "Least-privilege desktop shell for Ticketry"
license = "MIT"
edition = "2021"

[lib]
name = "muxed_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[features]
default = []
native-libghostty = []

[dependencies]
libc = "0.2"
portable-pty = "0.9"
process-wrap = { version = "9.1", default-features = false, features = [
    "std",
    "process-group",
] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.6"
