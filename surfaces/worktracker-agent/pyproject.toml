[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worktracker-agent"
version = "0.2.0"
description = "Standalone FastMCP server wired to the owned worktracker backend."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "fastmcp==3.2.0",
    "httpx>=0.27",
    "worktracker-sdk",
]

[tool.uv.sources]
worktracker-sdk = { path = "../worktracker-sdk", editable = true }

[tool.uv]
constraint-dependencies = [
    "cryptography>=50.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
packages = [
    "worktracker_agent",
    "worktracker_agent.api",
    "worktracker_agent.mcp",
]

[tool.setuptools.package-dir]
worktracker_agent = "."
