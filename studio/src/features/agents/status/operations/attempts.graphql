fragment AutomationAttemptFields on AutomationAttemptProjection {
  attempt_id
  root_attempt_id
  retry_of_attempt_id
  work_item_id
  status
  error
  failure
  retryable
  agent_run_id
  updated_at
}

query AutomationAttempts($projectId: String!, $taskId: String) {
  automation_attempts(project_id: $projectId, task_id: $taskId) {
    ...AutomationAttemptFields
  }
}

mutation RetryAutomationAttempt($attemptId: String!) {
  retry_automation_attempt(attempt_id: $attemptId) {
    ...AutomationAttemptFields
  }
}

mutation DismissAutomationAttempt($attemptId: String!) {
  dismiss_automation_attempt(attempt_id: $attemptId) {
    ...AutomationAttemptFields
  }
}
