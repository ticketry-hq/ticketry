name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop and sidecar
    # macOS runners are expensive: run only on push to main or on pull
    # requests whose head branch lives in this repository (not forks).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install JavaScript packages
        run: npm ci

      - name: Studio typecheck, tests, and build
        run: |
          npm run typecheck
          npm run test:overhaul --workspace @worktracker/studio
          npm run test --workspace @worktracker/studio
          npm run build

      - name: Backend sidecar tests
        working-directory: backend
        env:
          MUXED_DATA_DIR: ${{ runner.temp }}/ticketry-ci-data
          MUXED_STATE_DB: ${{ runner.temp }}/ticketry-ci-state.db
        run: uv run --extra dev pytest -q

      - name: MCP agent tests
        working-directory: surfaces/worktracker-agent
        run: uv run --group dev pytest -q

      - name: Build and verify desktop sidecar
        run: |
          sidecar="$(bash backend/packaging/build-sidecar.sh | tail -n 1)"
          bash backend/packaging/test-built-sidecar.sh "$sidecar"

      - name: Prepare native terminal renderer
        run: npm run libghostty:prepare --workspace @worktracker/studio

      - name: Python SDK tests
        working-directory: surfaces/worktracker-sdk
        run: uv run --extra dev pytest -q

      - name: Desktop Rust tests
        run: cargo test --manifest-path studio/src-tauri/Cargo.toml --features native-libghostty

      - name: Native clipboard seam tests
        run: npm run test:native-clipboard --workspace @worktracker/studio

      - name: Release contract tests
        run: |
          npm run release:test --workspace @worktracker/studio
          npm run release:validate --workspace @worktracker/studio
