subscription RunStatusStream($projectId: String!, $afterCursor: Int) {
  run_status_stream(project_id: $projectId, after_cursor: $afterCursor) {
    __typename
    ... on RunStatusSnapshot {
      project_id
      cursor
      at
      runs {
        agent_run_id
        project_id
        task_id
        module_id
        agent
        scope
        started_at
        state
        updated_at
        provider_session_id
      }
      automation_attempts {
        attempt_id
        root_attempt_id
        retry_of_attempt_id
        work_item_id
        status
        error
        failure
        retryable
        agent_run_id
        updated_at
      }
    }
    ... on RunStatusEvent {
      cursor
      event_id
      project_id
      event_kind
      payload_version
      subject_kind
      subject_id
      agent_run_id
      automation_attempt_id
      work_item_id
      payload
      committed_at
    }
    ... on RunStatusCaughtUp {
      project_id
      cursor
    }
    ... on RunStatusResetRequired {
      project_id
      cursor
      reason
    }
    ... on RunStatusFailed {
      code
      message
    }
  }
}
