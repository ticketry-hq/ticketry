[package]
name = "muxed-studio"
version = "0.1.0"
description = "Least-privilege desktop shell for Muxed Studio"
edition = "2021"

[lib]
name = "muxed_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[features]
default = []
native-libghostty = []

[dependencies]
libc = "0.2"
portable-pty = "0.9"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.6"
