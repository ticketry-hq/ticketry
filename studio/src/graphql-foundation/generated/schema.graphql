	set_work_item_blockers(id: String!, blocked_by_ids: [String!]!): WorkItem!
	add_work_item_blocker(id: String!, blocker_id: String!): WorkItem!
	add_work_item_dependent(id: String!, dependent_id: String!): WorkItem!
	create_issue_type_transition(issue_type_id: String!, from_state_id: String!, to_state_id: String!, agent_allowed: Boolean!, workflow_revision: Int!): IssueTypeTransition!
	update_issue_type_transition(issue_type_id: String!, from_state_id: String!, to_state_id: String!, agent_allowed: Boolean!, workflow_revision: Int!): IssueTypeTransition!
	delete_issue_type_transition(issue_type_id: String!, from_state_id: String!, to_state_id: String!, workflow_revision: Int!): Boolean!
	remove_state_from_issue_type_workflow(issue_type_id: String!, state_id: String!, workflow_revision: Int!): Boolean!
	upsert_issue_type_launch_binding(issue_type_id: String!, state_id: String!, workflow_revision: Int!, prompt: String, required_skills: [String!], model_id: String, reasoning_id: String, auto_start: Boolean, subtree_run_enabled: Boolean): LaunchBinding!
