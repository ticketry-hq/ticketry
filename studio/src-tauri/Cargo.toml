[package]
name = "ticketry"
default-run = "ticketry"
version = "0.1.0"
description = "Least-privilege desktop shell for Ticketry"
license = "MIT"
edition = "2021"

[lib]
name = "muxed_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "=2.6.3", features = [] }

[features]
default = []
native-libghostty = []

[dependencies]
async-graphql.workspace = true
async-trait = "=0.1.92"
axum = "=0.8.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util.workspace = true
http = "=1.4.2"
libc = "0.2"
notify = "=8.2.0"
portable-pty = "0.9"
process-wrap = { version = "9.1", default-features = false, features = [
    "std",
    "process-group",
] }
rand = "0.8"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "=3.0.0", features = ["transport-streamable-http-server"] }
sea-orm = { version = "=2.0.1", features = ["runtime-tokio-rustls", "seaography", "sqlx-sqlite"] }
sea-orm-migration = { version = "=2.0.1", features = ["runtime-tokio-rustls", "sqlx-sqlite"] }
seaography = { version = "=2.0.0-rc.9", default-features = false, features = ["field-camel-case", "macros", "with-chrono", "with-json"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tauri.workspace = true
tauri-graphql = { path = "crates/tauri-graphql" }
tauri-plugin-dialog = "2.6"
taurpc.workspace = true
tokio.workspace = true
tokio-util = "=0.7.18"
uuid = { version = "1.24", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.23.0"

[workspace]
members = [".", "crates/tauri-graphql"]
resolver = "2"

[workspace.dependencies]
async-graphql = { version = "=7.0.19", features = ["dynamic-schema"] }
futures-util = "=0.3.32"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri = "=2.11.5"
taurpc = "=0.8.2"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
