	projects: [Project!]!
	modules(project_id: String!, include_archived: Boolean): [Module!]!
	work_items(project_id: String, module_id: String, state_id: String): [WorkItem!]!
	work_items_by_ids(ids: [String!]!): [WorkItem!]!
	work_item(id: String!): WorkItem
	states(project_id: String!): [State!]!
	issue_types(project_id: String!): [IssueType!]!
	issue_type(id: String!): IssueType
	issue_type_transitions(issue_type_id: String!): [IssueTypeTransition!]!
	launch_bindings(project_id: String!): [LaunchBinding!]!
	providers: [Provider!]!
	agent_models: [AgentModel!]!
	reasoning_levels: [ReasoningLevel!]!
	attachments(issue_id: String!): [Attachment!]!
	keybinding_setting: KeybindingSetting
	provider_catalog: ProviderCatalog!
	local_settings: LocalSettings!
	automation_attempts(project_id: String!, task_id: String): [AutomationAttemptProjection!]!
	agent_run_holdings(project_id: String!, task_id: String): [AgentRunHolding!]!
}

